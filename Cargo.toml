[package]
name = "druto-redis"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "Asynchronous Redis connection manager, multiplexed pooling, pub/sub, Lua scripts, and transactions for Druto"
repository = "https://github.com/druto-rs/redis"
readme = "README.md"
keywords = ["redis", "async", "druto", "pool", "pubsub"]
categories = ["database", "asynchronous"]

[features]
default = []
tls = ["fred/enable-rustls-ring"]

[dependencies]
fred = { version = "10.1.0", default-features = false, features = [
    "transactions",
    "subscriber-client",
    "i-std",
    "i-scripts",
    "sha-1",
    "mocks",
] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros"] }
